[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "recallweaver"
version = "1.2.3"
description = "A lightweight local memory engine for AI agents"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.7",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
rw = "recallweaver.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/recallweaver"]

[tool.hatch.build.targets.wheel.force-include]
"schema.sql" = "recallweaver/schema.sql"

[tool.pytest.ini_options]
pythonpath = ["."]