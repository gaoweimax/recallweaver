[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recallweaver"
version = "0.1.0"
description = "A lightweight local memory engine for AI agents"
requires-python = "==3.11.9"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.7",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
rw = "recallweaver.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]